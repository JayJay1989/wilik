services:
  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
    volumes:
      - wilik-data:/app/instance
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8090:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  wilik-data:
