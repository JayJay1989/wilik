<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishdrop</title>
    <script>
      // set before first paint so there's no flash of the wrong theme;
      // kept in sync with src/colorScheme.js
      document.documentElement.dataset.theme = localStorage.getItem('wishdrop-color-scheme') || 'dark'
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
