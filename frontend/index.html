<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2dd4bf" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wilik" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wilik</title>
    <script>
      // set before first paint so there's no flash of the wrong theme; kept in sync with
      // src/colorScheme.js. The "-default" key is the admin's instance-wide default, cached
      // here the first time this browser fetches /api/settings (see App.jsx) -- a brand new
      // browser's very first-ever pageview still briefly uses the hardcoded 'dark' fallback.
      document.documentElement.dataset.theme =
        localStorage.getItem('wilik-color-scheme') || localStorage.getItem('wilik-color-scheme-default') || 'dark'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
